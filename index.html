<!DOCTYPE html>
<!-- saved from url=(0098)https://ais-dev-usznjkqr5y2ripfhobycex-479439212315.europe-west1.run.app/quicknotes-app/index.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script type="module" src="./index_files/client"></script>

    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="./index_files/style.css">
    <script src="./index_files/script.js.download" defer=""></script>
  <script src="./index_files/_aistudio-iframe.js.download"></script></head>
  <body>
    <header class="app-header">
      <div class="header-container">
        <h1 class="app-title">QuickNotes</h1>
        <p class="app-tagline">Capture your thoughts, stay organised.</p>
      </div>
    </header>

    <main class="main-content">
      <!-- Section 1: Add a note -->
      <section class="card-section" aria-labelledby="add-note-heading">
        <h2 id="add-note-heading" class="section-title">Add a note</h2>
        <form id="note-form" novalidate="">
          <div class="form-group form-input-group">
            <label for="note-input">Note text</label>
            <input type="text" id="note-input" name="note-input" placeholder="What's on your mind? (max 200 characters)" maxlength="250" autocomplete="off">
          </div>

          <div class="form-group form-select-group">
            <label for="note-category">Category</label>
            <select id="note-category" name="note-category">
              <option value="Personal">Personal</option>
              <option value="Work">Work</option>
              <option value="Study">Study</option>
            </select>
          </div>

          <div class="form-group form-btn-group">
            <button type="submit" id="add-note-btn" class="btn btn-primary">
              Add Note
            </button>
          </div>
        </form>

        <p id="error-message" role="alert" aria-live="polite"></p>
      </section>

      <!-- Section 2: Your notes -->
      <section class="card-section" aria-labelledby="your-notes-heading">
        <div class="section-header-row">
          <h2 id="your-notes-heading" class="section-title">Your notes</h2>
          <button type="button" id="clear-all-btn" class="btn btn-secondary">
            Clear all
          </button>
        </div>

        <div class="search-container">
          <label for="search-input" class="visually-hidden">Search notes</label>
          <input type="search" id="search-input" placeholder="Search notes by keyword..." autocomplete="off">
        </div>

        <p id="note-count">You have no notes yet.</p>

        <ul id="notes-list" aria-label="List of notes"><li class="empty-list-message">You have no notes yet. Create your first note above!</li></ul>
      </section>
    </main>

    <footer class="app-footer">
      <p>© 2026 QuickNotes App · Web Foundations Project 1</p>
    </footer>
  

</body></html>
